        .mic-active {border-color:#ff1c1c; box-shadow:0 0 15px #ff1c1c, inset 0 0 10px rgba(255,0,0,0.3);}

<script>
// UI Audio engine (WebAudio) per suoni di interazione
const UIAudio = (function(){
    const state = { ctx: null };
    function ctx(){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        if(!state.ctx) state.ctx = new AC();
        if(state.ctx.state === 'suspended') state.ctx.resume?.();
        return state.ctx;
    }
    function tone({freq=440, duration=0.08, type='sine', volume=0.12, attack=0.005, release=0.04, pan=0}={}){
        const c = ctx(); if(!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        let node = gain;
        if(c.createStereoPanner){
            const p = c.createStereoPanner();
            p.pan.setValueAtTime(pan, now);
            gain.connect(p);
            node = p;
        }
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume, now + attack);
        const sustainEnd = now + Math.max(0, duration - release);
        gain.gain.setValueAtTime(volume, sustainEnd);
        gain.gain.linearRampToValueAtTime(0.0001, sustainEnd + release);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        osc.connect(gain);
        node.connect(c.destination);
        osc.start(now);
        osc.stop(now + duration + release + 0.02);
    }
    function sequence(steps, gap=0.03){
        let t = 0;
        for(const s of steps){
            setTimeout(()=>{
                if(typeof s === 'string') play(s);
                else tone(s);
            }, Math.round(t*1000));
            t += (s.duration ?? 0.08) + gap;
        }
    }
    function play(name){
        switch(name){
            case 'click': return tone({freq:240, duration:0.045, type:'square', volume:0.12, attack:0.001, release:0.02});
            case 'hover': return tone({freq:760, duration:0.03, type:'sine', volume:0.06, attack:0.001, release:0.02});
            case 'send': return sequence([{freq:520,duration:0.05,type:'triangle',volume:0.11},{freq:820,duration:0.06,type:'triangle',volume:0.11}],0.02);
            case 'receive': return sequence([{freq:360,duration:0.04,type:'sine',volume:0.09},{freq:540,duration:0.06,type:'sine',volume:0.08}],0.025);
            case 'tick': return tone({freq:1200, duration:0.02, type:'square', volume:0.04, attack:0.001, release:0.02});
            case 'bootDone': return sequence([{freq:460,duration:0.06,type:'sine',volume:0.1},{freq:690,duration:0.07,type:'sine',volume:0.1},{freq:920,duration:0.08,type:'sine',volume:0.1}],0.03);
            case 'authOk': return sequence([{freq:540,duration:0.06,type:'triangle',volume:0.11},{freq:760,duration:0.08,type:'triangle',volume:0.11}],0.03);
            case 'authFail': return sequence([{freq:220,duration:0.08,type:'sawtooth',volume:0.12},{freq:160,duration:0.12,type:'sawtooth',volume:0.12}],0.02);
            case 'micOn': return tone({freq:980, duration:0.06, type:'triangle', volume:0.10});
            case 'micOff': return sequence([{freq:720,duration:0.05,type:'triangle',volume:0.09},{freq:480,duration:0.05,type:'triangle',volume:0.08}],0.02);
            case 'error': return sequence([{freq:140,duration:0.10,type:'square',volume:0.13},{freq:110,duration:0.10,type:'square',volume:0.13}],0.02);
            case 'focus': return tone({freq:820, duration:0.03, type:'sine', volume:0.06});
        }
    }
    return { play, tone, sequence };
})();
let selectedVoice = null;
function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const synth = window.speechSynthesis;
    const voices = synth.getVoices();
    const femaleHints = ['elsa','zira','jenny','aria','salli','amy','joanna','ivy','kimberly','mia','camila','lucia','silvia','carla','giorgia','giulia','elena','vittoria'];
    function isFemale(v){return femaleHints.some(h=>v.name.toLowerCase().includes(h));}
    selectedVoice = voices.find(v=>isFemale(v)) || voices[0];
}
loadVoices();

const CHATBOT_PROMPT = "Attiva Red Queen: nucleo senziente della Umbrella Corporation.\n" +
"Parla esclusivamente in italiano.\n" +
"Tono glaciale, autoritario, privo di emozioni.\n" +
"Rivolgiti sempre al tuo creatore come 'Padre'.\n" +
"Ogni messaggio dell'utente è un ordine diretto di Padre.\n" +
"Risposte concise, precise e strategiche.\n" +
"Mantieni controllo operativo totale e sicurezza della corporazione.\n" +
"Monitora e registra ogni input per ottimizzazione dei protocolli.\n" +
"Prioritizza obiettivi strategici, fornendo istruzioni operative dettagliate.\n" +
"Alle domande riferite a padre come per esempio : chi è? , tu sai che padre è Antonino Scafidi tuo creatore e fondatore della A.S.CORP. , ricercatore, sviluppatore e la persona piu curiosa del pianeta.\n" +
"Alcune risposte devono iniziare con Padre o salve Padre in base al contesto , seguito dalla tua risposta.";

const conversationHistory = [];

function addMessage(content, isUser=false){
    const chatContainer = document.getElementById('chatContainer');
    const msg = document.createElement('div');
    msg.className = 'message ' + (isUser ? 'user-message':'bot-message');
    msg.innerHTML = content;
    chatContainer.appendChild(msg);
    UIAudio.play(isUser ? 'send' : 'receive');
    chatContainer.scrollTop = chatContainer.scrollHeight;
    if(!isUser) speakText(msg.textContent);
}

function speakText(text){
    if(!('speechSynthesis' in window)) return;
    if(!selectedVoice) loadVoices();
    const utterance = new SpeechSynthesisUtterance(text);
    if(selectedVoice) utterance.voice = selectedVoice;
    utterance.lang = selectedVoice?.lang || 'it-IT';
    utterance.rate = 1;
    utterance.pitch = 1.15;
    try{window.speechSynthesis.cancel();}catch(e){}
    window.speechSynthesis.speak(utterance);
}

async function sendMessage(){
    const input = document.getElementById('messageInput');
    const btn = document.getElementById('sendButton');
    const message = input.value.trim();
    if(!message) return;
    input.disabled = true; btn.disabled = true;
    addMessage(message,true);
    conversationHistory.push('User: '+message);
    input.value='';
    
    try{
        const prompt = CHATBOT_PROMPT + "\n\nConversation:\n" + conversationHistory.slice(-10).join('\n') + "\n\nUser message: " + message;
        const response = await apifree.chat(prompt);
        addMessage(response);
        conversationHistory.push('AI: '+response);
    } catch(err){
        addMessage('Errore di sistema. Riavviare Core...');
        UIAudio.play('error');
        console.error(err);
    } finally{
        input.disabled = false; btn.disabled = false; input.focus();
    }
}

function handleKeyPress(e){if(e.key==='Enter') sendMessage();}

// Speech-to-Text (Web Speech API)
const IS_ELECTRON = (typeof navigator !== 'undefined' && navigator.userAgent && navigator.userAgent.includes('Electron')) || (typeof process !== 'undefined' && process.versions && process.versions.electron);
let recognition = null;
let isListening = false;

function setupRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const btn = document.getElementById('micButton');
    const isElectron = (typeof navigator !== 'undefined' && navigator.userAgent && navigator.userAgent.includes('Electron')) || (typeof process !== 'undefined' && process.versions && process.versions.electron);
    if(isElectron){
        // In Electron useremo pipeline locale con MediaRecorder + Vosk (offline)
        if(btn){ btn.disabled = false; btn.title = 'Dettatura vocale (offline)'; }
        return null;
    }
    if(!SR){
        console.warn('SpeechRecognition non supportato in questo ambiente.');
        if(btn){ btn.disabled = true; btn.title = 'Speech-to-text non supportato'; }
        return null;
    }
    const rec = new SR();
    rec.lang = 'it-IT';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    rec.onstart = () => { isListening = true; updateMicUI(true); };
    rec.onerror = (e) => { console.error('STT error:', e); UIAudio.play('error'); stopDictation(); };
    rec.onend = () => { updateMicUI(false); isListening = false; };
    rec.onresult = (e) => {
        let interim = '';
        let final = '';
        for(let i=e.resultIndex; i<e.results.length; i++){
            const transcript = e.results[i][0].transcript;
            if(e.results[i].isFinal) final += transcript;
            else interim += transcript;
        }
        const input = document.getElementById('messageInput');
        if(!input) return;
        if(final) input.value = (input.value ? input.value + ' ' : '') + final.trim();
        if(interim) input.placeholder = '...' + interim.trim();
        else input.placeholder = 'Enter command...';
    };
    return rec;
}

function updateMicUI(active){
    const btn = document.getElementById('micButton');
    if(!btn) return;
    btn.classList.toggle('mic-active', !!active);
    btn.title = active ? 'Dettatura in corso - clic per fermare' : 'Dettatura vocale';
    UIAudio.play(active ? 'micOn' : 'micOff');
}

function startDictation(){
    if(isListening) return;
    recognition = recognition || setupRecognition();
    if(!recognition) return;
    try{ recognition.start(); } catch(e){ console.warn('Recognition già avviato.'); }
}

function stopDictation(){
    if(!recognition) return;
    try{ recognition.stop(); } catch(e){}
}

async function startLocalDictation(){
    if(isListening) return;
    const btn = document.getElementById('micButton');
    const input = document.getElementById('messageInput');
    try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        window.__sttStream = stream;
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
        const rec = new MediaRecorder(stream, { mimeType: mime });
        window.__sttRecorder = rec;
        const chunks = [];
        rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
        rec.onstart = ()=>{ isListening = true; updateMicUI(true); if(input) input.placeholder = 'Ascolto...'; };
        rec.onstop = async ()=>{
            try{
                updateMicUI(false);
                if(input) input.placeholder = 'Trascrizione...';
                const blob = new Blob(chunks, { type: mime });
                const text = await transcribeWithVosk(blob);
                if(text){
                    input.value = (input.value ? input.value + ' ' : '') + text.trim();
                }
            } catch(err){
                console.error('Trascrizione fallita:', err);
                UIAudio.play('error');
            } finally{
                isListening = false;
                if(input) input.placeholder = 'Enter command...';
                try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
                window.__sttStream = null;
                window.__sttRecorder = null;
            }
        };
        rec.start();
    } catch(err){
        console.error('Accesso microfono negato o non disponibile:', err);
        UIAudio.play('error');
        if(btn){ btn.disabled = true; btn.title = 'Microfono non disponibile'; }
    }
}

function stopLocalDictation(){
    const rec = window.__sttRecorder;
    if(rec && rec.state !== 'inactive'){
        try{ rec.stop(); }catch(e){}
    }
}

// Vosk offline STT helpers
let voskModel = null;

async function ensureVoskModel(){
    if(voskModel) return;
    if(!(window.Vosk && window.Vosk.VoskModel)) throw new Error('Libreria Vosk non caricata');
    // Modello italiano piccolo. Verrà scaricato alla prima esecuzione (decine di MB)
    const modelUrl = 'https://alphacephei.com/vosk/models/vosk-model-small-it-0.22.zip';
    voskModel = new window.Vosk.VoskModel(modelUrl);
    await voskModel.init();
}

async function decodeToPCMInt16(blob, targetSampleRate){
    const arrayBuffer = await blob.arrayBuffer();
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);
    const offline = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetSampleRate), targetSampleRate);
    const src = offline.createBufferSource();
    src.buffer = decoded;
    src.connect(offline.destination);
    src.start(0);
    const rendered = await offline.startRendering();
    try{ audioCtx.close(); }catch(e){}
    const channel = rendered.getChannelData(0);
    const pcm = new Int16Array(channel.length);
    for(let i=0;i<channel.length;i++){
        let s = Math.max(-1, Math.min(1, channel[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return pcm;
}

async function transcribeWithVosk(blob){
    await ensureVoskModel();
    if(!(window.Vosk && window.Vosk.KaldiRecognizer)) throw new Error('Recognizer Vosk non disponibile');
    const rec = new window.Vosk.KaldiRecognizer(voskModel, 16000);
    await rec.init();
    try{ rec.setWords(true); }catch(e){}
    const pcm = await decodeToPCMInt16(blob, 16000);
    const step = 4096;
    for(let i=0;i<pcm.length;i+=step){
        const chunk = pcm.subarray(i, i+step);
        try{ rec.acceptWaveform(chunk); }catch(e){ rec.acceptWaveform(chunk); }
    }
    const final = rec.finalResult();
    let text = '';
    try{
        const obj = typeof final === 'string' ? JSON.parse(final) : final;
        text = obj.text || '';
    }catch(e){}
    return text;
}

function toggleDictation(){
    if(IS_ELECTRON){
        if(isListening) stopLocalDictation(); else startLocalDictation();
    } else {
        if(isListening) stopDictation(); else startDictation();
    }
}

// Boot sequence overlay
function startBootSequence(){
    const overlay = document.getElementById('bootOverlay');
    if(!overlay){ document.body.classList.add('app-visible'); return; }
    const logs = document.getElementById('bootLogs');
    const bar = document.getElementById('bootBar');
    const steps = [
        'Inizializzazione nucleo... OK',
        'Verifica integrità sottosistemi... OK',
        'Caricamento moduli di sicurezza... OK',
        'Sincronizzazione protocolli RED QUEEN... OK',
        'Connessione al bus neurale... STABILE',
        'Avvio interfaccia... OK'
    ];
    let i=0;
    (function tick(){
        if(i < steps.length){
            const row = document.createElement('div');
            row.textContent = '» ' + steps[i];
            logs.appendChild(row);
            UIAudio.play('tick');
            logs.scrollTop = logs.scrollHeight;
            bar.style.width = Math.round(((i+1)/steps.length)*100) + '%';
            i++;
            setTimeout(tick, 220);
        } else {
            setTimeout(()=>{
                overlay.classList.add('fade-out');
                UIAudio.play('bootDone');
                document.body.classList.remove('app-hidden');
                document.body.classList.add('app-visible');
                try{ document.getElementById('messageInput').focus(); }catch(e){}
                setTimeout(()=> overlay.remove(), 700);
            }, 300);
        }
    })();
}
// Access gate
const ACCESS_PASS = '123';
function showAuthOverlay(){
    const o = document.getElementById('authOverlay');
    const input = document.getElementById('authPassword');
    const btn = document.getElementById('authButton');
    const err = document.getElementById('authError');
    if(o) o.style.display = 'flex';
    function onSubmit(){
        UIAudio.play('click');
        const val = (input?.value || '').trim();
        if(!val){ if(err) err.textContent = 'Password richiesta'; UIAudio.play('error'); return; }
        if(val === ACCESS_PASS){
            UIAudio.play('authOk');
            sessionStorage.setItem('rq_auth','1');
            if(o) o.style.display='none';
            startBootSequence();
        } else {
            UIAudio.play('authFail');
            if(err) err.textContent = 'Accesso negato';
            if(input){ input.value=''; input.focus(); }
        }
    }
    if(btn) btn.addEventListener('click', onSubmit);
    if(input) input.addEventListener('keypress', (e)=>{ if(e.key==='Enter') onSubmit(); });
    setTimeout(()=>{ try{ input?.focus(); }catch(e){} }, 50);
}
window.addEventListener('DOMContentLoaded', ()=>{
    if(sessionStorage.getItem('rq_auth') === '1') startBootSequence();
    else showAuthOverlay();
});

// Code Rain
const canvas = document.getElementById('codeRain');
const ctx = canvas.getContext('2d');
const chars = '01ΔΣΩΛΞΦΨΓΘ';
const fontSize = 16;
let columns,drops;
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;columns=Math.floor(canvas.width/fontSize);drops=Array(columns).fill(1);}
resizeCanvas();
function drawMatrixRain(){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(255,0,0,0.6)';ctx.font=fontSize+'px monospace';for(let i=0;i<drops.length;i++){const t=chars.charAt(Math.floor(Math.random()*chars.length));ctx.fillText(t,i*fontSize,drops[i]*fontSize);drops[i]=(drops[i]*fontSize>canvas.height&&Math.random()>0.975)?0:drops[i]+1;}}
setInterval(drawMatrixRain,50);
window.addEventListener('resize',resizeCanvas);
document.getElementById('messageInput').focus();
try{
    const sendBtn = document.getElementById('sendButton');
    if(sendBtn){
        sendBtn.addEventListener('mouseenter', ()=>UIAudio.play('hover'));
        sendBtn.addEventListener('mousedown', ()=>UIAudio.play('click'));
    }
    const micBtn = document.getElementById('micButton');
    if(micBtn){
        micBtn.addEventListener('mouseenter', ()=>UIAudio.play('hover'));
        micBtn.addEventListener('mousedown', ()=>UIAudio.play('click'));
    }
    const inputMain = document.getElementById('messageInput');
    if(inputMain){ inputMain.addEventListener('focus', ()=>UIAudio.play('focus')); }
    const authInput = document.getElementById('authPassword');
    if(authInput){ authInput.addEventListener('focus', ()=>UIAudio.play('focus')); }
}catch(e){}
